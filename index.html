<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoSkyCast – Luxembourg</title>
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 2rem;
      color: #111827;
    }
    h1 {
      text-align: center;
      margin-bottom: 0.5rem;
    }
    #astro {
      max-width: 860px;
      margin: 1rem auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }
    .card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 1rem;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,.05);
    }
    .card h3 {
      margin-top: 0;
      font-size: 1.1rem;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: .35rem 0;
      border-bottom: 1px dashed #eee;
    }
    .muted {
      color: #6b7280;
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>PhotoSkyCast – Luxembourg</h1>
  <div id="astro"></div>

  <script>
  (function(){
    var lat=49.6116, lon=6.1319, tz="Europe/Luxembourg";
    var out=document.getElementById("astro");

    function tf(iso){return new Date(iso).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",hour12:false,timeZone:tz});}
    function df(d){return new Intl.DateTimeFormat('de-LU',{dateStyle:'full',timeZone:tz}).format(d);}
    function addMin(iso,m){return new Date(new Date(iso).getTime()+m*60000);}
    function span(a,b){return (a&&b)? (tf(a)+"–"+tf(b)):"—";}
    function card(title,rows){
      var h='<div class="card"><h3>'+title+'</h3>';
      for(var i=0;i<rows.length;i++){
        h+='<div class="row"><span>'+rows[i][0]+'</span><strong>'+rows[i][1]+'</strong></div>';
      }
      h+='</div>'; return h;
    }
    function moonEmoji(p){ if(p==null)return"🌙"; if(p<.06||p>.94)return"🌑"; if(p<.19)return"🌒"; if(p<.31)return"🌓"; if(p<.44)return"🌔"; if(p<.56)return"🌕"; if(p<.69)return"🌖"; if(p<.81)return"🌗"; return"🌘"; }

    // --- SUN ---
    var urlSun="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon
               +"&timezone="+encodeURIComponent(tz)+"&forecast_days=1&daily=sunrise,sunset";

    // --- MOON ---
    var urlMoon="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon
               +"&timezone="+encodeURIComponent(tz)+"&forecast_days=1&daily=moon_phase,moon_illumination";

    Promise.all([fetch(urlSun,{cache:"no-store"}), fetch(urlMoon,{cache:"no-store"})])
      .then(responses => Promise.all(responses.map(r=>r.json())))
      .then(([sunData,moonData])=>{
        var d=sunData.daily||{};
        var sr=d.sunrise&&d.sunrise[0], ss=d.sunset&&d.sunset[0];
        var blueAm=sr?[addMin(sr,-30),new Date(sr)]:[null,null];
        var bluePm=ss?[new Date(ss),addMin(ss,30)]:[null,null];
        var goldAm=sr?[new Date(sr),addMin(sr,60)]:[null,null];
        var goldPm=ss?[addMin(ss,-60),new Date(ss)]:[null,null];

        var dm=moonData.daily||{};
        var phase=dm.moon_phase&&dm.moon_phase[0], illum=dm.moon_illumination&&Math.round(dm.moon_illumination[0]);

        out.innerHTML =
          '<div class="card" style="grid-column:1/-1;text-align:center">'
          +'<h2>Luxembourg</h2><div class="muted">'+df(new Date())+'</div></div>'
          +card("Sonne", [["Sonnenaufgang",sr?tf(sr):"—"],["Sonnenuntergang",ss?tf(ss):"—"]])
          +card("Blaue Stunde",[["Morgens",span(blueAm[0],blueAm[1])],["Abends",span(bluePm[0],bluePm[1])]])
          +card("Goldene Stunde",[["Morgens",span(goldAm[0],goldAm[1])],["Abends",span(goldPm[0],goldPm[1])]])
          +card("Mond",[["Mondphase",phase!=null?moonEmoji(phase):"—"],["Helligkeit",illum!=null?(illum+"%"):"—"]]);
      })
      .catch(e=>{
        out.innerHTML='<div style="color:red">Fehler: '+e.message+'</div>';
        if(window.console)console.error(e);
      });
  })();
  </script>
</body>
</html>
